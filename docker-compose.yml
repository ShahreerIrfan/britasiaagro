services:
  british-merchants:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: british-merchants-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - ./public/uploads:/app/public/uploads
